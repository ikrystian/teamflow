# Lokalne usługi deweloperskie Nexusa.
#
# - mongo     — moduł projektów i zadań (Prisma). Prisma wymaga replica setu (transakcje),
#               więc Mongo startuje jako jednowęzłowy replica set "rs0" — healthcheck
#               inicjalizuje go przy pierwszym starcie.
# - postgres  — moduł klientów (CRM), sejf dostępów E2E, konta i sesje (Better Auth),
#               dziennik zdarzeń. Row Level Security — aplikacja łączy się rolą nexus_app.
# - redis     — wspólne limity zapytań (opcjonalnie; bez niego limity w pamięci procesu).
# - mailpit   — podgląd wysyłanych e-maili: http://localhost:8028
#
#   npm run db:up    # start usług
#   npm run db:down  # stop (dane zostają w wolumenach)
#   npm run setup    # pełny setup po sklonowaniu repo

services:
  mongo:
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1027:1025"
      - "127.0.0.1:8028:8025"

volumes:
  mongo-data:
  mongo-config:
  pg-data:
