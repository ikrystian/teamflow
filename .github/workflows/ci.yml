# CI: lint, typy, testy jednostkowe (z progiem pokrycia modułu kryptograficznego sejfu) i build.
# Testy end-to-end (Playwright) uruchamia się lokalnie — zob. docs/SCALENIE_CLIENTS.md.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123
      CRON_SECRET: ci-cron-secret-123456
      CAPTCHA_SECRET: ci-captcha-secret-123456
      POSTGRES_URL: postgres://nexus_app:nexus_app@127.0.0.1:5434/nexus
      DATABASE_URL: mongodb://127.0.0.1:27017/nexus?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
